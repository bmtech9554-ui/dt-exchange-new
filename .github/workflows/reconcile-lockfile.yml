name: Reconcile dependency lockfile
on:
  push:
    branches:
      - fix/reconcile-nestjs-lockfile-20261025
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate npm lockfile from manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit reconciled lockfile for CI verification
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches manifests"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): reconcile npm lockfile"
            git push
          fi
      - name: Validate install and security
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run test --workspace @dt/admin
          npm run build
