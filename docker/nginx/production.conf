worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  # Do not log URL query strings, authorization, cookies or request bodies.
  log_format safe escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","status":$status,"duration":$request_time}';
  access_log /var/log/nginx/access.log safe;
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 30s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api { server api:4000; keepalive 32; }
  upstream admin { server admin:3000; keepalive 16; }
  # Replace example.invalid hostnames and supply a matching certificate before use.
  server { listen 8080 default_server; server_name _; return 444; }
  server { listen 8080; server_name api.example.invalid admin.example.invalid www.example.invalid; return 308 https://$host$request_uri; }
  server {
    listen 8443 ssl default_server; server_name _;
    ssl_certificate /run/tls/fullchain.pem; ssl_certificate_key /run/tls/privkey.pem;
    return 444;
  }
  server {
    listen 8443 ssl; server_name api.example.invalid;
    ssl_certificate /run/tls/fullchain.pem; ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/api/v1/(manual|admin/manual)/files$ {
      client_max_body_size 6m;
      limit_req zone=api burst=5 nodelay;
      proxy_pass http://api; proxy_http_version 1.1;
      proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 30s;
    }
    location / {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://api; proxy_http_version 1.1;
      proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 5s; proxy_read_timeout 30s; proxy_send_timeout 30s;
    }
  }
  server {
    listen 8443 ssl; server_name admin.example.invalid;
    ssl_certificate /run/tls/fullchain.pem; ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = /api/operations/manual/files {
      client_max_body_size 6m;
      proxy_pass http://admin; proxy_http_version 1.1;
      proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 30s;
    }
    location / {
      proxy_pass http://admin; proxy_http_version 1.1;
      proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s; proxy_read_timeout 30s;
    }
  }
  server {
    listen 8443 ssl; server_name www.example.invalid;
    ssl_certificate /run/tls/fullchain.pem; ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = /downloads/DTExchange.apk {
      alias /srv/dt-release/DTExchange.apk;
      default_type application/vnd.android.package-archive;
      add_header Cache-Control 'no-store';
      add_header X-Content-Type-Options nosniff always;
      add_header Strict-Transport-Security 'max-age=31536000' always;
    }
    location = /downloads/DTExchange.apk.sha256 {
      alias /srv/dt-release/DTExchange.apk.sha256;
      default_type text/plain;
      add_header Cache-Control 'no-store';
    }
    location ~ ^/(download$|_next/|brand/) {
      proxy_pass http://admin; proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }
    location / { return 404; }
  }
}
