# Include from nginx http context. Enable only after all four DNS names and certificates are verified.
# BEGIN GENERATED ANDROID 8018 ACCOUNT ACCESS
# Generated by scripts/render-android-access.py; http context only.
# This is an additional client routing restriction, not financial authorization.
map $http_x_dt_version_code $dt_8018_client { default 0; 8018 1; }
map "$request_method:$uri" $dt_8018_account_route {
 default 0;
 "~^OPTIONS:/api/v1/.*$" 1;
 "~^POST:/api/v1/auth/(register|login|request-otp|verify-otp|refresh|forgot-password|reset-password|contact/request-otp|contact/verify-otp|change-password|logout|logout-all)/?$" 1;
 "~^(GET|HEAD):/api/v1/(app/configuration|app/version/android|app/terms|users/me|rates/usdt-inr|wallet|history|settings|sessions|bank-accounts|manual/deposits|referrals/me)/?$" 1;
 "~^(GET|HEAD):/api/v1/settings/legal/(privacy|terms)/?$" 1;
 "~^(GET|HEAD):/api/v1/(history|bank-accounts|manual/deposits|manual/files|sell/orders)/[0-9a-fA-F-]{36}/?$" 1;
 "~^POST:/api/v1/bank-accounts/?$" 1;
 "~^PATCH:/api/v1/bank-accounts/[0-9a-fA-F-]{36}/default/?$" 1;
 "~^DELETE:/api/v1/(bank-accounts|sessions)/[0-9a-fA-F-]{36}/?$" 1;
 "~^POST:/api/v1/sessions/logout-others/?$" 1;
 "~^PATCH:/api/v1/settings/preferences/?$" 1;
 "~^POST:/api/v1/settings/(pin|pin/verify|delete-account)/?$" 1;
 "~^(GET|HEAD):/api/v1/notifications(/(preferences|announcements))?/?$" 1;
 "~^POST:/api/v1/notifications/(read-all|devices)/?$" 1;
 "~^PATCH:/api/v1/notifications/(preferences|[0-9a-fA-F-]{36}/read)/?$" 1;
 "~^DELETE:/api/v1/notifications/(devices/)?[0-9a-fA-F-]{36}/?$" 1;
 "~^(GET|HEAD):/api/v1/support/(faq|tickets|tickets/[0-9a-fA-F-]{36}|attachments/[0-9a-fA-F-]{36})/?$" 1;
 "~^POST:/api/v1/support/tickets(/[0-9a-fA-F-]{36}/(replies|close|attachments))?/?$" 1;
}
map "$dt_8018_client:$dt_8018_account_route" $dt_8018_blocked {
 default 0;
 "1:0" 1;
}
# END GENERATED ANDROID 8018 ACCOUNT ACCESS
log_format dt_safe escape=json '{"time":"$time_iso8601","method":"$request_method","status":$status,"duration":$request_time}';
limit_req_zone $binary_remote_addr zone=dt_api:10m rate=10r/s;
map $http_upgrade $dt_connection_upgrade { default upgrade; '' close; }
server {
 listen 80; server_name dtexchange.app www.dtexchange.app api.dtexchange.app admin.dtexchange.app;
 location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; try_files $uri =404; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl; server_name www.dtexchange.app;
 ssl_certificate /etc/letsencrypt/live/dtexchange.app/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dtexchange.app/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 return 301 https://dtexchange.app$request_uri;
}
server {
 listen 443 ssl; server_name dtexchange.app;
 ssl_certificate /etc/letsencrypt/live/dtexchange.app/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dtexchange.app/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off; autoindex off;
 access_log /var/log/nginx/dtexchange-access.log dt_safe;
 error_log /var/log/nginx/dtexchange-error.log warn;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
 client_max_body_size 64k;
 location = / { proxy_pass http://127.0.0.1:3000/site; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location = /download { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location = /invite { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location ~ ^/legal/(privacy|terms)$ { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location ^~ /_next/static/ { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location ~ ^/(brand|product)/ { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location = /downloads/DTExchange.apk { alias /srv/dtexchange/releases/approved/DTExchange.apk; default_type application/vnd.android.package-archive; add_header Cache-Control no-store; add_header X-Content-Type-Options nosniff always; }
 location = /downloads/DTExchange.apk.sha256 { alias /srv/dtexchange/releases/approved/DTExchange.apk.sha256; default_type text/plain; add_header Cache-Control no-store; }
 location / { return 404; }
}
server {
 listen 443 ssl; server_name admin.dtexchange.app;
 ssl_certificate /etc/letsencrypt/live/dtexchange.app/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dtexchange.app/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off; autoindex off;
 access_log /var/log/nginx/dtexchange-access.log dt_safe;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 client_max_body_size 64k;
 location = / { return 302 /dashboard; }
 location = /api/operations/manual/files { client_max_body_size 6m; proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location / { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
}
server {
 listen 443 ssl; server_name api.dtexchange.app;
 ssl_certificate /etc/letsencrypt/live/dtexchange.app/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dtexchange.app/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off; autoindex off;
 access_log /var/log/nginx/dtexchange-access.log dt_safe;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 client_max_body_size 64k;
 location ~ ^/(health|metrics)(/|$) { return 404; }
 location ~ ^/api/v1/(manual|admin/manual)/files$ { client_max_body_size 6m; limit_req zone=dt_api burst=5 nodelay; default_type application/json; if ($dt_8018_blocked) { return 403 '{"error":{"code":"Forbidden","message":"Service temporarily paused"}}'; } proxy_pass http://127.0.0.1:4000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location /api/v1/ { limit_req zone=dt_api burst=30 nodelay; default_type application/json; if ($dt_8018_blocked) { return 403 '{"error":{"code":"Forbidden","message":"Service temporarily paused"}}'; } proxy_pass http://127.0.0.1:4000; include /etc/nginx/snippets/dtexchange-proxy.conf; }
 location / { return 404; }
}
# HSTS deliberately omitted until every hostname is verified over HTTPS. No preload.
