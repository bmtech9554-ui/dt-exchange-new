# Generated by scripts/render-android-access.py; http context only.
# This is an additional client routing restriction, not financial authorization.
map $http_x_dt_version_code $dt_8018_client { default 0; 8018 1; }
map "$request_method:$uri" $dt_8018_account_route {
 default 0;
 "~^OPTIONS:/api/v1/.*$" 1;
 "~^POST:/api/v1/auth/(register|login|request-otp|verify-otp|refresh|forgot-password|reset-password|contact/request-otp|contact/verify-otp|change-password|logout|logout-all)/?$" 1;
 "~^(GET|HEAD):/api/v1/(app/configuration|app/version/android|app/terms|users/me|rates/usdt-inr|wallet|history|settings|sessions|bank-accounts|manual/deposits|referrals/me)/?$" 1;
 "~^(GET|HEAD):/api/v1/settings/legal/(privacy|terms)/?$" 1;
 "~^(GET|HEAD):/api/v1/(history|bank-accounts|manual/deposits|manual/files|sell/orders)/[0-9a-fA-F-]{36}/?$" 1;
 "~^POST:/api/v1/bank-accounts/?$" 1;
 "~^PATCH:/api/v1/bank-accounts/[0-9a-fA-F-]{36}/default/?$" 1;
 "~^DELETE:/api/v1/(bank-accounts|sessions)/[0-9a-fA-F-]{36}/?$" 1;
 "~^POST:/api/v1/sessions/logout-others/?$" 1;
 "~^PATCH:/api/v1/settings/preferences/?$" 1;
 "~^POST:/api/v1/settings/(pin|pin/verify|delete-account)/?$" 1;
 "~^(GET|HEAD):/api/v1/notifications(/(preferences|announcements))?/?$" 1;
 "~^POST:/api/v1/notifications/(read-all|devices)/?$" 1;
 "~^PATCH:/api/v1/notifications/(preferences|[0-9a-fA-F-]{36}/read)/?$" 1;
 "~^DELETE:/api/v1/notifications/(devices/)?[0-9a-fA-F-]{36}/?$" 1;
 "~^(GET|HEAD):/api/v1/support/(faq|tickets|tickets/[0-9a-fA-F-]{36}|attachments/[0-9a-fA-F-]{36})/?$" 1;
 "~^POST:/api/v1/support/tickets(/[0-9a-fA-F-]{36}/(replies|close|attachments))?/?$" 1;
}
map "$dt_8018_client:$dt_8018_account_route" $dt_8018_blocked {
 default 0;
 "1:0" 1;
}
