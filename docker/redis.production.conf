# Managed service equivalent: TLS-only, private network, ACL credentials from secret manager.
port 0
tls-port 6379
tls-cert-file /run/tls/redis.crt
tls-key-file /run/tls/redis.key
tls-ca-cert-file /run/tls/ca.crt
aclfile /run/secrets/redis.acl
protected-mode yes
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
save 900 1
save 300 10
save 60 10000
# Set maxmemory to 70% of the service memory allocation through deployment config.
