name: Repair NestJS lockfile
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-lockfile.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/persist-nestjs-lockfile-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Regenerate committed lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize NestJS lockfile"
          git push
