# STAGED ONLY. Replace the matching existing rules; never install duplicate rules.
# Preserve all rotated logs. No automatic deletion, shred, or copytruncate.
# Monitor capacity; do not enable until archival/disk headroom is proven.
/var/log/nginx/*.log {
  daily
  rotate -1
  compress
  delaycompress
  missingok
  notifempty
  create 0640 www-data adm
  sharedscripts
  postrotate
    /usr/sbin/nginx -s reopen
  endscript
}
/srv/dtexchange/logs/*.log /var/log/dtexchange-*.log {
  su root adm
  daily
  rotate -1
  compress
  delaycompress
  missingok
  notifempty
  create 0640 root adm
}
