# Included ONLY inside the existing dtexchange.app TLS server.
location = /download/test {
  proxy_pass http://172.31.118.3:3000;
  include /etc/nginx/snippets/dtexchange-proxy.conf;
}
location = /test-admin {
  proxy_pass http://172.31.118.3:3000;
  include /etc/nginx/snippets/dtexchange-proxy.conf;
}
location ^~ /test-assets/_next/static/ {
  rewrite ^/test-assets/(.*)$ /$1 break;
  proxy_pass http://172.31.118.3:3000;
  include /etc/nginx/snippets/dtexchange-proxy.conf;
}
location ^~ /test-api/api/v1/ {
  limit_req zone=dt_public_test burst=15 nodelay;
  limit_req_status 429;
  limit_conn dt_public_test_connections 8;
  client_max_body_size 1500k;
  proxy_pass http://172.31.118.4:4118/api/v1/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 5s;
  proxy_read_timeout 20s;
  proxy_next_upstream off;
  add_header Cache-Control no-store always;
  add_header X-Content-Type-Options nosniff always;
}
# Publication adds exact APK and metadata aliases only after physical validation.
